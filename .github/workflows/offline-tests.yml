name: Offline tests

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release tag matches integration manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Run offline tests (no Home Assistant or device connection)
        run: python -m unittest discover -s tests -v
      - name: Compile custom integration and tests
        run: python -m compileall -q custom_components/senec_marstek_gate tests
